name: Diagnostic

on:
  push:
    paths:
      - '.github/workflows/diagnostic.yml'
  repository_dispatch:
    types: [diagnostic]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Append diagnostic result
        run: |
          set -euo pipefail
          mkdir -p .github
          echo "$(date -u) event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} sha=${GITHUB_SHA}" >> .github/diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostic.log
          git commit -m "chore: diagnostic workflow run"
          git push origin HEAD:main
