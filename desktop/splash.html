<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'"
    />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          system-ui,
          -apple-system,
          'Noto Sans CJK SC',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 600px at 30% 0%, rgba(69, 103, 255, 0.22), transparent 60%),
          #0b1220;
        color: #e6ecff;
        user-select: none;
      }
      .card {
        width: 420px;
        max-width: calc(100vw - 48px);
        padding: 40px 36px 32px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.02));
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .icon {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 22px 0 6px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      .subtitle {
        margin: 0;
        font-size: 13px;
        color: #8e9cc0;
      }
      .spinner {
        width: 20px;
        height: 20px;
        margin: 30px auto 12px;
        border-radius: 50%;
        border: 2px solid rgba(120, 150, 255, 0.25);
        border-top-color: #6f8cff;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .status {
        margin: 0;
        font-size: 13px;
        color: #aab8dc;
      }
      .hint {
        margin: 24px 0 0;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        font-size: 12px;
        line-height: 1.6;
        color: #6f7d9e;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="assets/icon.png" alt="DeepSeek Harness" />
      <h1>DeepSeek Harness</h1>
      <p class="subtitle">本地服务正在启动</p>
      <div class="spinner" aria-hidden="true"></div>
      <p class="status">正在初始化 dsh 与 Web UI…</p>
      <p class="hint">首次启动或首次创建 profile 时可能需要几秒钟。<br />数据保存在 ~/.dsh，不会随窗口关闭而丢失。</p>
    </main>
  </body>
</html>
